      // 4. One-Click Copy Email to Clipboard + Toast Feedback
      const copyEmailBtn = document.getElementById('copyEmailBtn');
      const copyToast = document.getElementById('copyToast');
      const toastMessage = document.getElementById('toastMessage');
      const emailAddress = 'wajid.student@example.com';
      let toastTimeout;

      function copyTextToClipboard(text, message, onSuccess) {
        const tempInput = document.createElement('textarea');
        tempInput.value = text;
        tempInput.setAttribute('readonly', '');
        tempInput.style.position = 'absolute';
        tempInput.style.left = '-9999px';
        document.body.appendChild(tempInput);
        tempInput.select();

        try {
          document.execCommand('copy');
          triggerToast(message, onSuccess);
        } catch (err) {
          if (navigator.clipboard) {
            navigator.clipboard.writeText(text).then(() => triggerToast(message, onSuccess));
          }
        } finally {
          document.body.removeChild(tempInput);
        }
      }

      function triggerToast(message, onSuccess) {
        clearTimeout(toastTimeout);
        if (toastMessage && message) toastMessage.textContent = message;
        copyToast.classList.add('show');
        if (onSuccess) onSuccess();

        toastTimeout = setTimeout(() => {
          copyToast.classList.remove('show');
        }, 2600);
      }

      copyEmailBtn.addEventListener('click', () => {
        copyTextToClipboard(emailAddress, 'Email address copied to clipboard!', () => {
          copyEmailBtn.innerHTML = '<i class="fa-solid fa-check"></i><span>Copied!</span>';
          setTimeout(() => {
            copyEmailBtn.innerHTML = '<i class="fa-regular fa-copy"></i><span>Copy Email</span>';
          }, 2600);
        });
      });

      // 4B. Interactive Bangladesh & Basail, Narsingdi Real Map Initialization
      const basailCoords = [23.9229, 90.7177]; // Basail, Narsingdi, Dhaka, Bangladesh
      const bangladeshCenter = [23.6850, 90.3563];
      const mapContainer = document.getElementById('bangladeshRealMap');
      const fallbackMap = document.getElementById('bdFallbackMap');

      if (typeof L !== 'undefined' && mapContainer) {
        const realMap = L.map('bangladeshRealMap', {
          center: basailCoords,
          zoom: 13,
          scrollWheelZoom: false
        });

        const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          attribution: '&copy; OpenStreetMap contributors'
        });

        const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
          maxZoom: 18,
          attribution: 'Tiles &copy; Esri &mdash; Earthstar Geographics'
        });

        streetLayer.addTo(realMap);

        // Custom pulsing radar pin on Basail, Narsingdi
        const pulseIcon = L.divIcon({
          className: '',
          html: '<div class="gps-pulse-marker"><div class="gps-pulse-ring"></div><div class="gps-pulse-core"></div></div>',
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        });

        const marker = L.marker(basailCoords, { icon: pulseIcon }).addTo(realMap);
        marker.bindPopup(`
          <div style="font-family: 'Plus Jakarta Sans', sans-serif; min-width: 195px;">
            <strong style="color: #38bdf8; font-size: 0.95rem;">Syed Shah Wajid</strong><br/>
            <span style="font-size: 0.85rem;">Basail, Narsingdi, Dhaka, Bangladesh</span><br/>
            <small style="color: #94a3b8;">NKM High School &amp; Homes • Scout ID: ZK2044</small>
          </div>
        `).openPopup();

        // Highlight radius around Basail, Narsingdi
        L.circle(basailCoords, {
          color: '#38bdf8',
          fillColor: '#38bdf8',
          fillOpacity: 0.12,
          weight: 1.5,
          radius: 900
        }).addTo(realMap);

        // Layer switcher buttons (Street Map / Satellite / Cyber Radar)
        const modeButtons = document.querySelectorAll('[data-map-mode]');
        modeButtons.forEach(btn => {
          btn.addEventListener('click', () => {
            modeButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const mode = btn.getAttribute('data-map-mode');

            if (mode === 'satellite') {
              if (realMap.hasLayer(streetLayer)) realMap.removeLayer(streetLayer);
              if (!realMap.hasLayer(satelliteLayer)) satelliteLayer.addTo(realMap);
              mapContainer.classList.remove('cyber-filter');
            } else if (mode === 'cyber') {
              if (realMap.hasLayer(satelliteLayer)) realMap.removeLayer(satelliteLayer);
              if (!realMap.hasLayer(streetLayer)) streetLayer.addTo(realMap);
              mapContainer.classList.add('cyber-filter');
            } else {
              if (realMap.hasLayer(satelliteLayer)) realMap.removeLayer(satelliteLayer);
              if (!realMap.hasLayer(streetLayer)) streetLayer.addTo(realMap);
              mapContainer.classList.remove('cyber-filter');
            }
          });
        });

        // Zoom out to full Bangladesh country view or fly back to Basail, Narsingdi
        document.getElementById('zoomBangladeshBtn')?.addEventListener('click', () => {
          realMap.flyTo(bangladeshCenter, 7, { duration: 1.4 });
        });

        document.getElementById('recenterBasailBtn')?.addEventListener('click', () => {
          realMap.flyTo(basailCoords, 14, { duration: 1.4 });
          marker.openPopup();
        });
      } else if (mapContainer && fallbackMap) {
        mapContainer.style.display = 'none';
        fallbackMap.style.display = 'flex';
